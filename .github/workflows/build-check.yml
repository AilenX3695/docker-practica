name: Docker Build Checks

on:
  push:
    branches:
      - main

jobs:

  build-check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false

