name: Docker Build Checks

on:
  push:
    branches:
      - main

jobs:

  build-check:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Check
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false

      - name: Bake Check
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl

